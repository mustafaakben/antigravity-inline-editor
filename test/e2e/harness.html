<!doctype html>
<html>
<head><meta charset="utf-8"><title>Edits test host</title>
<style>html,body{margin:0;height:100%}iframe{border:0;width:100%;height:100%}</style></head>
<body>
<iframe id="view" src="/editor.html"></iframe>
<script>
// A minimal MCP Apps host that behaves like Antigravity's file viewer surface: it sends the
// file entrypoint arguments, serves resources/read for the opaque file URI, implements
// com.google.antigravity/resources/write, and proxies tools/call to the real plugin server.
const host = window.host = {
  disk: new Map(), log: [], context: null, failWrites: false, canWrite: true,
  file: { name: 'notes.md', resourceUri: 'antigravity-file://test-view/notes.md' },
};
const frame = document.getElementById('view');
const send = message => frame.contentWindow.postMessage({ jsonrpc: '2.0', ...message }, '*');
const reply = (id, result) => send({ id, result });
const fail = (id, code, message) => send({ id, error: { code, message } });
host.reload = () => { frame.src = '/editor.html?' + Date.now(); };
window.addEventListener('message', async ({ data, source }) => {
  if (source !== frame.contentWindow || data?.jsonrpc !== '2.0') return;
  host.log.push(data);
  const { id, method, params } = data;
  switch (method) {
    case 'ui/initialize':
      return reply(id, {
        protocolVersion: params.protocolVersion, hostInfo: { name: 'test-host', version: '1.0.0' },
        hostCapabilities: { serverTools: {}, serverResources: {}, updateModelContext: { text: {} }, message: { text: {} } },
        hostContext: {
          theme: 'dark', platform: 'web', displayMode: 'inline',
          styles: { variables: { '--color-background-primary': '#101418', '--color-text-primary': '#e6e6e6' } },
          ...(host.canWrite ? { 'com.google.antigravity/resources': { write: {} } } : {}),
        },
      });
    case 'ui/notifications/initialized':
      return send({ method: 'ui/notifications/tool-input', params: { arguments: { file: host.file } } });
    case 'resources/read':
      if (!host.disk.has(params.uri)) return fail(id, -32002, 'Not found');
      return reply(id, { contents: [{ uri: params.uri, mimeType: 'application/octet-stream', blob: host.disk.get(params.uri) }] });
    case 'com.google.antigravity/resources/write':
      if (host.failWrites) return reply(id, { isError: true });
      host.disk.set(params.uri, params.blob);
      return reply(id, {});
    case 'tools/call': {
      const response = await fetch('/mcp', { method: 'POST', body: JSON.stringify({ jsonrpc: '2.0', id: 1, method, params }) }).then(r => r.json());
      return response.error ? fail(id, response.error.code, response.error.message) : reply(id, response.result);
    }
    case 'ui/update-model-context':
      host.context = params;
      return reply(id, {});
    case 'ping':
      return reply(id, {});
    default:
      if (id !== undefined) fail(id, -32601, `Method not found: ${method}`);
  }
});
</script>
</body>
</html>
