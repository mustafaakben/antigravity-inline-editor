<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Edits</title>
<style>/*STYLES*/</style>
</head>
<body>
<main id="edits" class="edits" data-ready="false">
  <div class="edits-toolbar">
    <div id="modes" class="edits-modes" role="group" aria-label="View" hidden>
      <button id="mode-preview" type="button" aria-pressed="false">Preview</button>
      <button id="mode-edit" type="button" aria-pressed="true">Edit</button>
    </div>
    <span id="status" class="edits-status" role="status" aria-live="polite"></span>
    <div id="conflict" class="edits-conflict" hidden>
      <button id="use-disk" type="button" class="edits-action" title="Discard your edits and show the file as it is on disk">Use disk version</button>
      <button id="keep-mine" type="button" class="edits-action edits-primary" title="Write your version over the disk changes">Keep mine</button>
    </div>
    <div id="restored" class="edits-conflict" hidden>
      <button id="discard-restored" type="button" class="edits-action" title="Drop the restored edits and show the file as it is on disk">Discard</button>
      <button id="save-restored" type="button" class="edits-action edits-primary" title="Write the restored edits to the file">Save</button>
    </div>
    <div class="edits-history">
      <button id="undo" type="button" class="edits-icon" aria-label="Undo" disabled>
        <svg width="16" height="16" viewBox="0 -960 960 960" fill="currentColor" aria-hidden="true"><path d="M280-200v-80h284q63 0 109.5-40T720-420q0-60-46.5-100T564-560H312l104 104-56 56-200-200 200-200 56 56-104 104h252q97 0 166.5 63T800-420q0 94-69.5 157T564-200H280Z"/></svg>
      </button>
      <button id="redo" type="button" class="edits-icon" aria-label="Redo" disabled>
        <svg width="16" height="16" viewBox="0 -960 960 960" fill="currentColor" aria-hidden="true"><path d="M396-200q-97 0-166.5-63T160-420q0-94 69.5-157T396-640h252L544-744l56-56 200 200-200 200-56-56 104-104H396q-63 0-109.5 40T240-420q0 60 46.5 100T396-280h284v80H396Z"/></svg>
      </button>
    </div>
    <button id="find" type="button" class="edits-action" aria-pressed="false">Find</button>
  </div>
  <div id="code" class="edits-code"></div>
  <article id="preview" class="edits-preview"></article>
  <div id="empty" class="edits-empty"><p id="empty-text">Loading…</p></div>
  <footer id="footer" class="edits-footer">
    <span id="hint" class="edits-hint"></span>
    <span id="attached" class="edits-attached" hidden>
      <span id="attached-label"></span>
      <button id="clear-attached" type="button" class="edits-link">Clear</button>
    </span>
  </footer>
  <div id="selection" class="edits-selection" hidden>
    <button id="comment" type="button">Comment <span class="edits-keys" data-keys="⌥⌘M"></span></button>
    <button id="quote" type="button">Quote <span class="edits-keys" data-keys="⌘L"></span></button>
  </div>
  <div id="composer" class="edits-composer" role="dialog" aria-label="Comment on selection" hidden>
    <textarea id="composer-input" rows="3" placeholder="Write a comment..." aria-label="Comment"></textarea>
    <div class="edits-composer-actions">
      <button id="composer-cancel" type="button" class="edits-action">Cancel</button>
      <button id="composer-submit" type="button" class="edits-action edits-primary">Comment</button>
    </div>
  </div>
</main>
<script type="module">/*SCRIPT*/</script>
</body>
</html>
