name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Check that plugin/editor.html matches the sources
        run: npm run build:check
      - name: CLI smoke test
        run: |
          node bin/cli.mjs --version
          node bin/cli.mjs doctor

  view-in-browser:
    name: View in headless Chrome
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:e2e

  install-from-git:
    name: npx install from git (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pack and install like npx would
        run: |
          npm pack
          npm install -g ./antigravity-inline-editor-*.tgz
          antigravity-inline-editor --version
          antigravity-inline-editor install
          antigravity-inline-editor status
          test -f "$HOME/.gemini/config/plugins/inline-editor/editor.html"
          test -f "$HOME/.gemini/config/plugins/inline-editor/plugin.json"
          antigravity-inline-editor uninstall
          test ! -e "$HOME/.gemini/config/plugins/inline-editor"
