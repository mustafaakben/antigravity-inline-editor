name: Bug report
description: Something in the Edits tab or the installer does not work.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for the report. Please do not paste document contents or personal file paths you would rather keep private.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: textarea
    id: doctor
    attributes:
      label: Output of `antigravity-inline-editor doctor`
      description: Remove anything private before pasting.
      render: json
    validations:
      required: true
  - type: input
    id: antigravity
    attributes:
      label: Antigravity version
      placeholder: e.g. 2.29.0
    validations:
      required: true
